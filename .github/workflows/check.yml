name: Check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck stow zsh
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: brew install shellcheck stow
      - name: Install Python check dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run checks
        run: ./script/check --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Stow smoke-test image
        run: docker build -t kalavero-dotfiles-check .
