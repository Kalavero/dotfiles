name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck stow zsh neovim
      - name: Install macOS check dependencies
        if: runner.os == 'macOS'
        run: brew install shellcheck stow neovim
      - name: Install Python check dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run checks
        run: ./script/check --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Stow smoke-test image
        run: docker build -t kalavero-dotfiles-check .
      - name: Run the Stow smoke test
        run: |
          docker run --rm kalavero-dotfiles-check sh -ec '
            for f in /root/.zshrc /root/.zshenv /root/.gitconfig /root/.tmux.conf /root/.aliases /root/.config/starship.toml /root/.local/bin/tat; do
              [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
              case "$(readlink -f "$f")" in
                /root/kalavero_dotfiles/*) ;;
                *) echo "NOT STOWED FROM REPO: $f"; exit 1 ;;
              esac
            done
            zsh -ic "alias gs >/dev/null && whence tat >/dev/null"
            tmux new-session -d -s smoke && tmux kill-session -t smoke
          '
